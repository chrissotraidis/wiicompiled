# This branch is KartPad's Android runtime, not the upstream desktop product.
# Test its exact source in a pinned, public KartPad consumer and compile the full
# Android runtime with no translated game code. Desktop product/platform jobs
# belong to the respective platform branches; never relax the arm64 guard or
# replace a dependency checksum merely to satisfy those inherited jobs here.
name: Build
on:
  push:
    branches: [kartpad-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  translator:
    name: Translator (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('translator/Translator.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore translator/Translator.sln

      - name: Build
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Test
        run: dotnet test translator/Translator.sln -c Release --no-build --verbosity normal

  android:
    name: Android runtime (compile, link and contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: chrissotraidis/kartpad
          ref: 5f18b3924fb25867af88a05e223d840b4d5bce81
          path: kartpad
          submodules: recursive
          persist-credentials: false
      - name: Use this runtime revision in the integration checkout
        env:
          RUNTIME_SHA: ${{ github.sha }}
        run: |
          git -C kartpad/vendor/runtimes/android fetch origin "$RUNTIME_SHA"
          git -C kartpad/vendor/runtimes/android checkout --detach "$RUNTIME_SHA"
          git -C kartpad add vendor/runtimes/android
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Runtime behavior contracts (ASan/UBSan)
        working-directory: kartpad
        env:
          CXX: clang++
        run: |
          for test in test_draw_merge_boundaries test_draw_topology test_graphics_startup_failure test_imgui_partial_shutdown test_staging_map_lifecycle test_staging_capacity test_android_controller_routing test_efb_readback_lifecycle test_sleep_timer_reentry; do
            python3 -B -m unittest discover -s tests -p "$test.py" -v
          done
          python3 scripts/test-android-event-service.py
          python3 scripts/test-android-gx-vertex-snapshot.py
          python3 scripts/test-android-keyboard-expiry.py
          python3 scripts/test-shared-runtime-parity.py
      - name: Install the pinned Android compile toolchain
        working-directory: kartpad
        run: |
          source scripts/android-toolchain-versions.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$KARTPAD_ANDROID_COMPILE_SDK" "build-tools;$KARTPAD_ANDROID_BUILD_TOOLS" "ndk;$KARTPAD_ANDROID_NDK" "cmake;$KARTPAD_ANDROID_CMAKE"
      - name: Compile and link the complete runtime without game inputs
        working-directory: kartpad
        run: scripts/build-android-runtime-ci.sh build/runtime-ci
